<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
  <title id="title">Mobile production system architecture blueprint</title>
  <desc id="desc">A vertical production architecture flow from discovery through interface, domain core, delivery, and operations, supported by security, performance, observability, documentation, and automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b17"/><stop offset="1" stop-color="#0b1224"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="640" height="1120" rx="24" fill="url(#bg)"/>
  <rect width="640" height="1120" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="638" height="1118" rx="23" fill="none" stroke="url(#accent)" stroke-opacity=".4" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="40" y="55" fill="#f8fafc" font-size="24" font-weight="800">PRODUCTION SYSTEM BLUEPRINT</text>
    <text x="40" y="84" fill="#64748b" font-size="13" letter-spacing="1">BUSINESS PROBLEM → RELIABLE OPERATION</text>
    <rect x="40" y="104" width="560" height="3" rx="1.5" fill="url(#accent)"/>

    <g transform="translate(40 140)">
      <rect width="560" height="142" rx="16" fill="#0c1427" stroke="#38bdf8" stroke-opacity=".35"/>
      <text x="24" y="34" fill="#7dd3fc" font-size="15" font-weight="800" letter-spacing="1">01 / DISCOVER</text>
      <text x="24" y="70" fill="#e2e8f0" font-size="15">Problem space  •  Domain model</text>
      <text x="24" y="101" fill="#e2e8f0" font-size="15">Constraints  •  Success metrics</text>
    </g>
    <path d="M320 282v28" stroke="#64748b" stroke-width="2"/><path d="m314 306 6 10 6-10z" fill="#94a3b8"/>

    <g transform="translate(40 316)">
      <rect width="560" height="142" rx="16" fill="#0c1427" stroke="#8b5cf6" stroke-opacity=".35"/>
      <text x="24" y="34" fill="#c4b5fd" font-size="15" font-weight="800" letter-spacing="1">02 / INTERFACE</text>
      <text x="24" y="70" fill="#e2e8f0" font-size="15">Web &amp; mobile  •  REST contracts</text>
      <text x="24" y="101" fill="#e2e8f0" font-size="15">Authentication  •  Validation</text>
    </g>
    <path d="M320 458v28" stroke="#64748b" stroke-width="2"/><path d="m314 482 6 10 6-10z" fill="#94a3b8"/>

    <g transform="translate(40 492)">
      <rect width="560" height="164" rx="18" fill="#111b38" stroke="url(#accent)" stroke-width="2"/>
      <text x="280" y="39" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="1">DOMAIN CORE</text>
      <text x="280" y="72" text-anchor="middle" fill="#bae6fd" font-size="15">Business rules  •  Explicit contracts</text>
      <text x="280" y="104" text-anchor="middle" fill="#99f6e4" font-size="15">Type-safe boundaries</text>
      <text x="280" y="136" text-anchor="middle" fill="#94a3b8" font-size="13">THE STABLE CENTER</text>
    </g>
    <path d="M320 656v28" stroke="#64748b" stroke-width="2"/><path d="m314 680 6 10 6-10z" fill="#94a3b8"/>

    <g transform="translate(40 690)">
      <rect width="560" height="142" rx="16" fill="#0c1427" stroke="#2dd4bf" stroke-opacity=".35"/>
      <text x="24" y="34" fill="#99f6e4" font-size="15" font-weight="800" letter-spacing="1">03 / DELIVERY</text>
      <text x="24" y="70" fill="#e2e8f0" font-size="15">Data systems  •  AI workflows</text>
      <text x="24" y="101" fill="#e2e8f0" font-size="15">Integrations  •  Async processing</text>
    </g>
    <path d="M320 832v28" stroke="#64748b" stroke-width="2"/><path d="m314 856 6 10 6-10z" fill="#94a3b8"/>

    <g transform="translate(40 866)">
      <rect width="560" height="142" rx="16" fill="#0c1427" stroke="#38bdf8" stroke-opacity=".35"/>
      <text x="24" y="34" fill="#7dd3fc" font-size="15" font-weight="800" letter-spacing="1">04 / OPERATE</text>
      <text x="24" y="70" fill="#e2e8f0" font-size="15">Cloud runtime  •  CI / CD</text>
      <text x="24" y="101" fill="#e2e8f0" font-size="15">Observability  •  Feedback loops</text>
    </g>

    <rect x="40" y="1038" width="560" height="48" rx="12" fill="#0b1d2b" stroke="#2dd4bf" stroke-opacity=".35"/>
    <text x="320" y="1068" text-anchor="middle" fill="#99f6e4" font-size="12" font-weight="700" letter-spacing="1">SECURE • OBSERVABLE • AUTOMATED • DOCUMENTED</text>
  </g>
</svg>
