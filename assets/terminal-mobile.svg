<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-labelledby="title desc">
  <title id="title">Ahmad Bin Tahir mobile terminal identity</title><desc id="desc">A responsive black and phosphor-green cybersecurity terminal introducing Ahmad Bin Tahir.</desc>
