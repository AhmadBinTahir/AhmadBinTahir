    <g transform="translate(34 681)" font-size="13"><text x="0" y="0" fill="#00ff88" font-weight="700">root@abt</text><text x="68" y="0" fill="#6d967e">:</text><text x="78" y="0" fill="#7df9c2">~</text><text x="90" y="0" fill="#f0fff8"># ./build --secure --production</text><rect x="350" y="-13" width="8" height="17" fill="#00ff88"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect></g>
