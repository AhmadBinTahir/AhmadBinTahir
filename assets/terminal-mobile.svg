      <text x="0" y="58" fill="#f0fff8" font-size="34" font-weight="800">AHMAD BIN TAHIR</text><text x="0" y="91" fill="#7df9c2" font-size="15">software_engineer :: systems_architect</text><text x="0" y="116" fill="#7df9c2" font-size="15">cybersecurity :: ai_engineering</text>
      <g font-size="14"><text x="0" y="165" fill="#00ff88">LOCATION</text><text x="132" y="165" fill="#a3c9b5">Lahore, Pakistan</text><text x="0" y="198" fill="#00ff88">EDUCATION</text><text x="132" y="198" fill="#a3c9b5">BSc Cybersecurity @ UCP</text><text x="0" y="231" fill="#00ff88">ORIGIN</text><text x="132" y="231" fill="#a3c9b5">Coding since age 10</text><text x="0" y="264" fill="#00ff88">MISSION</text><text x="132" y="264" fill="#a3c9b5">Systems built to last</text></g>
