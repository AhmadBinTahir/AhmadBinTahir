  <rect width="640" height="720" rx="14" fill="#020604"/><rect width="640" height="720" rx="14" fill="url(#glow)"/><rect width="640" height="720" rx="14" fill="url(#scan)"/><rect x="1" y="1" width="638" height="718" rx="13" fill="none" stroke="#00ff88" stroke-opacity=".55" stroke-width="2"/>
  <g font-family="Consolas, 'Courier New', monospace">
