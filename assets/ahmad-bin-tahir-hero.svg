<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Ahmad Bin Tahir — Software Engineer and Systems Architect</title>
  <desc id="desc">A dark cyber-architecture banner with a glowing monogram, connected system nodes, and Ahmad Bin Tahir's professional title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.48" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#070b17"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.52" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="420" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <ellipse cx="940" cy="196" rx="330" ry="260" fill="url(#glow)"/>
    <circle cx="1090" cy="-30" r="190" fill="#7c3aed" opacity=".08" filter="url(#blur)"/>
    <circle cx="80" cy="430" r="210" fill="#0ea5e9" opacity=".07" filter="url(#blur)"/>

    <g opacity=".55" stroke-linecap="round">
      <path d="M740 93 H835 L879 137 H1042" fill="none" stroke="#38bdf8" stroke-opacity=".45"/>
      <path d="M700 324 H827 L876 275 H1115" fill="none" stroke="#2dd4bf" stroke-opacity=".38"/>
      <path d="M785 205 H919" fill="none" stroke="#a78bfa" stroke-opacity=".55"/>
      <path d="M947 205 L1000 255 H1146" fill="none" stroke="#a78bfa" stroke-opacity=".28"/>
      <circle cx="740" cy="93" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
      <circle cx="879" cy="137" r="4" fill="#38bdf8"/>
      <circle cx="1042" cy="137" r="4" fill="#38bdf8" filter="url(#softGlow)"/>
      <circle cx="700" cy="324" r="4" fill="#2dd4bf"/>
      <circle cx="876" cy="275" r="4" fill="#2dd4bf" filter="url(#softGlow)"/>
      <circle cx="1115" cy="275" r="4" fill="#2dd4bf"/>
      <circle cx="785" cy="205" r="4" fill="#a78bfa"/>
      <circle cx="919" cy="205" r="4" fill="#a78bfa" filter="url(#softGlow)"/>
      <circle cx="1146" cy="255" r="4" fill="#a78bfa"/>
    </g>

    <g transform="translate(842 80)">
      <rect width="270" height="260" rx="24" fill="#080d1d" fill-opacity=".82" stroke="#38bdf8" stroke-opacity=".2"/>
      <rect x="18" y="18" width="234" height="224" rx="16" fill="#0c1329" stroke="#94a3b8" stroke-opacity=".11"/>
      <circle cx="39" cy="38" r="4" fill="#fb7185"/>
      <circle cx="54" cy="38" r="4" fill="#fbbf24"/>
      <circle cx="69" cy="38" r="4" fill="#34d399"/>
      <path d="M39 62 H231" stroke="#94a3b8" stroke-opacity=".12"/>
      <text x="135" y="156" text-anchor="middle" fill="url(#cyan)" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-7">ABT</text>
      <path d="M71 181 H199" stroke="url(#violet)" stroke-width="3" stroke-linecap="round"/>
      <text x="135" y="209" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" letter-spacing="3">ENGINEER • ARCHITECT</text>
    </g>

    <g transform="translate(70 79)" font-family="Segoe UI, Arial, sans-serif">
      <rect x="0" y="0" width="178" height="30" rx="15" fill="#0c1c31" stroke="#38bdf8" stroke-opacity=".35"/>
      <circle cx="18" cy="15" r="4" fill="#2dd4bf" filter="url(#softGlow)"/>
      <text x="32" y="20" fill="#bae6fd" font-size="11" font-weight="600" letter-spacing="1.2">LAHORE, PAKISTAN</text>

      <text x="0" y="98" fill="#f8fafc" font-size="53" font-weight="800" letter-spacing="-1.5">AHMAD BIN TAHIR</text>
      <rect x="0" y="116" width="410" height="5" rx="2.5" fill="url(#cyan)"/>
      <text x="0" y="163" fill="#cbd5e1" font-size="21" font-weight="500" letter-spacing=".4">Software Engineer  •  Systems Architect</text>
      <text x="0" y="197" fill="#94a3b8" font-size="16" letter-spacing=".35">AI Systems  /  Cloud  /  Cybersecurity  /  Automation</text>

      <g transform="translate(0 233)">
        <rect width="152" height="34" rx="8" fill="#0d2135" stroke="#38bdf8" stroke-opacity=".28"/>
        <text x="76" y="22" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="1">BUILD FOR SCALE</text>
        <rect x="164" width="164" height="34" rx="8" fill="#131a37" stroke="#a78bfa" stroke-opacity=".28"/>
        <text x="246" y="22" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700" letter-spacing="1">SECURE BY DESIGN</text>
        <rect x="340" width="180" height="34" rx="8" fill="#0b2527" stroke="#2dd4bf" stroke-opacity=".28"/>
        <text x="430" y="22" text-anchor="middle" fill="#99f6e4" font-size="11" font-weight="700" letter-spacing="1">PRODUCTION FIRST</text>
      </g>
    </g>

    <rect x=".75" y=".75" width="1198.5" height="418.5" rx="25.25" fill="none" stroke="url(#violet)" stroke-opacity=".38" stroke-width="1.5"/>
  </g>
</svg>
