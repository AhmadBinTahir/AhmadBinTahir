<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Let&apos;s build something that lasts</title>
  <desc id="desc">ABT Dev Services footer in a black and phosphor-green terminal style.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020604"/>
      <stop offset="0.55" stop-color="#04120c"/>
      <stop offset="1" stop-color="#020604"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop stop-color="#00ff88" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00ff88" stroke-opacity=".035"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="230" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="230" rx="14" fill="url(#glow)"/>
  <rect width="1200" height="230" rx="14" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="228" rx="13" fill="none" stroke="#00ff88" stroke-opacity=".5" stroke-width="2"/>

  <g fill="none" stroke="#00ff88">
    <path d="M32 35h205l18 18h690l18-18h205" stroke-opacity=".42"/>
    <path d="M32 195h300m536 0h300" stroke-opacity=".18"/>
    <path d="M80 115h115m810 0h115" stroke-opacity=".14"/>
  </g>

  <g fill="#00ff88" filter="url(#soft)">
    <circle cx="32" cy="35" r="3"/>
    <circle cx="1168" cy="35" r="3"/>
    <circle cx="195" cy="115" r="2.5"/>
    <circle cx="1005" cy="115" r="2.5"/>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" text-anchor="middle">
    <text x="600" y="78" fill="#00ff88" font-size="12" font-weight="700" letter-spacing="4">TRANSMISSION COMPLETE // NEXT MISSION READY</text>
    <text x="600" y="127" fill="#f0fff8" font-size="30" font-weight="800" letter-spacing="1">LET&apos;S BUILD SOMETHING THAT LASTS.</text>
    <text x="600" y="164" fill="#7df9c2" font-size="13" letter-spacing="2">SECURE BY DESIGN  ·  ENGINEERED TO SCALE  ·  BUILT FOR PRODUCTION</text>
    <text x="600" y="205" fill="#315b46" font-size="11" letter-spacing="2">ABT DEV SERVICES  //  LAHORE, PAKISTAN  //  AVAILABLE WORLDWIDE</text>
  </g>

  <g font-family="Consolas, 'Courier New', monospace" font-size="10">
    <text x="32" y="218" fill="#315b46">0x41 0x42 0x54</text>
    <text x="1168" y="218" text-anchor="end" fill="#315b46">STATUS: ONLINE</text>
  </g>
</svg>
