<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Ahmad Bin Tahir terminal identity</title>
  <desc id="desc">A black and phosphor-green cybersecurity terminal introducing Ahmad Bin Tahir as a software engineer, systems architect, and cybersecurity student.</desc>
  <defs>
    <radialGradient id="glow" cx="82%" cy="50%" r="65%"><stop offset="0" stop-color="#00ff88" stop-opacity=".09"/><stop offset=".55" stop-color="#003d25" stop-opacity=".05"/><stop offset="1" stop-color="#020604" stop-opacity="0"/></radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 3.5H1200" stroke="#b7ffd9" stroke-opacity=".025"/></pattern>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="440" rx="14" fill="#020604"/><rect width="1200" height="440" rx="14" fill="url(#glow)"/><rect width="1200" height="440" rx="14" fill="url(#scan)"/>
  <rect x="1" y="1" width="1198" height="438" rx="13" fill="none" stroke="#00ff88" stroke-opacity=".55" stroke-width="2"/>
  <g font-family="Consolas, 'Courier New', monospace">
    <path d="M1 48H1199" stroke="#00ff88" stroke-opacity=".25"/>
    <circle cx="25" cy="24" r="5" fill="#ff5f57"/><circle cx="43" cy="24" r="5" fill="#febc2e"/><circle cx="61" cy="24" r="5" fill="#28c840"/>
    <text x="600" y="29" text-anchor="middle" fill="#6d967e" font-size="12">ahmad@abt:~/identity — secure shell</text><text x="1168" y="29" text-anchor="end" fill="#315b46" font-size="11">[TLS 1.3]</text>
    <g transform="translate(48 78)">
      <text x="0" y="0" fill="#00ff88" font-size="15" font-weight="700">ahmad@abt</text><text x="88" y="0" fill="#6d967e" font-size="15">:</text><text x="98" y="0" fill="#7df9c2" font-size="15">~</text><text x="110" y="0" fill="#f0fff8" font-size="15">$ whoami</text>
      <text x="0" y="63" fill="#f0fff8" font-size="49" font-weight="800" letter-spacing="-1">AHMAD BIN TAHIR</text>
      <text x="2" y="98" fill="#7df9c2" font-size="17">software_engineer :: systems_architect :: cybersecurity</text>
      <g font-size="14">
        <text x="2" y="145" fill="#315b46">01</text><text x="36" y="145" fill="#00ff88">LOCATION</text><text x="154" y="145" fill="#a3c9b5">Lahore, Pakistan</text>
        <text x="2" y="176" fill="#315b46">02</text><text x="36" y="176" fill="#00ff88">EDUCATION</text><text x="154" y="176" fill="#a3c9b5">BSc Cybersecurity @ UCP</text>
        <text x="2" y="207" fill="#315b46">03</text><text x="36" y="207" fill="#00ff88">ORIGIN</text><text x="154" y="207" fill="#a3c9b5">Writing code since age 10</text>
        <text x="2" y="238" fill="#315b46">04</text><text x="36" y="238" fill="#00ff88">MISSION</text><text x="154" y="238" fill="#a3c9b5">Build systems that survive production</text>
      </g>
    </g>
    <g transform="translate(840 92)">
      <path d="M138 0 264 55v91c0 76-49 123-126 153C61 269 12 222 12 146V55Z" fill="#04120c" stroke="#00ff88" stroke-opacity=".65" stroke-width="2"/>
      <path d="M138 24 239 68v76c0 61-39 99-101 125-62-26-101-64-101-125V68Z" fill="none" stroke="#00ff88" stroke-opacity=".15"/>
      <text x="138" y="112" text-anchor="middle" fill="#00ff88" font-size="16" filter="url(#soft)">ACCESS</text><text x="138" y="148" text-anchor="middle" fill="#f0fff8" font-size="25" font-weight="800">GRANTED</text>
      <text x="138" y="183" text-anchor="middle" fill="#6d967e" font-size="12">NODE / LAHORE</text><text x="138" y="211" text-anchor="middle" fill="#315b46" font-size="11">0x41 0x42 0x54</text>
      <path d="M88 231H188" stroke="#00ff88" stroke-opacity=".4"/><circle cx="138" cy="231" r="3" fill="#00ff88" filter="url(#soft)"/>
    </g>
    <g transform="translate(48 398)" font-size="14">
      <text x="0" y="0" fill="#00ff88" font-weight="700">root@abt</text><text x="72" y="0" fill="#6d967e">:</text><text x="82" y="0" fill="#7df9c2">/opt/future</text><text x="178" y="0" fill="#f0fff8"># ./build --secure --scalable --production</text>
      <rect x="539" y="-14" width="9" height="18" fill="#00ff88"><animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/></rect>
