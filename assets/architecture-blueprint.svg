<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Ahmad Bin Tahir's production system architecture blueprint</title>
  <desc id="desc">A layered architecture diagram flowing from product discovery through interfaces and a domain core to delivery and operations, with security and observability across every layer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b17"/><stop offset="1" stop-color="#0b1224"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111b38"/><stop offset="1" stop-color="#0b2830"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="458" rx="23" fill="none" stroke="url(#accent)" stroke-opacity=".35" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="54" y="56" fill="#f8fafc" font-size="22" font-weight="700" letter-spacing="1">PRODUCTION SYSTEM BLUEPRINT</text>
    <text x="54" y="82" fill="#64748b" font-size="13" letter-spacing="1.4">FROM BUSINESS PROBLEM TO RELIABLE OPERATION</text>
    <rect x="54" y="98" width="1092" height="3" rx="1.5" fill="url(#accent)" opacity=".75"/>

    <g transform="translate(54 133)">
      <rect width="188" height="194" rx="16" fill="#0c1427" stroke="#38bdf8" stroke-opacity=".3"/>
      <circle cx="24" cy="27" r="5" fill="#38bdf8" filter="url(#glow)"/>
      <text x="40" y="33" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="1">01 / DISCOVER</text>
      <path d="M20 51H168" stroke="#94a3b8" stroke-opacity=".12"/>
      <text x="24" y="82" fill="#e2e8f0" font-size="14">Problem space</text>
      <text x="24" y="111" fill="#e2e8f0" font-size="14">Domain model</text>
      <text x="24" y="140" fill="#e2e8f0" font-size="14">Constraints</text>
      <text x="24" y="169" fill="#e2e8f0" font-size="14">Success metrics</text>
    </g>

    <g transform="translate(270 133)">
      <rect width="188" height="194" rx="16" fill="#0c1427" stroke="#8b5cf6" stroke-opacity=".3"/>
      <circle cx="24" cy="27" r="5" fill="#8b5cf6" filter="url(#glow)"/>
      <text x="40" y="33" fill="#c4b5fd" font-size="14" font-weight="700" letter-spacing="1">02 / INTERFACE</text>
      <path d="M20 51H168" stroke="#94a3b8" stroke-opacity=".12"/>
      <text x="24" y="82" fill="#e2e8f0" font-size="14">Web &amp; mobile</text>
      <text x="24" y="111" fill="#e2e8f0" font-size="14">REST contracts</text>
      <text x="24" y="140" fill="#e2e8f0" font-size="14">Authentication</text>
      <text x="24" y="169" fill="#e2e8f0" font-size="14">Validation</text>
    </g>

    <g transform="translate(486 120)">
      <rect width="228" height="220" rx="20" fill="url(#core)" stroke="url(#accent)" stroke-opacity=".75" stroke-width="2"/>
      <text x="114" y="42" text-anchor="middle" fill="#f8fafc" font-size="17" font-weight="800" letter-spacing="1.5">DOMAIN CORE</text>
      <text x="114" y="65" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="1">THE STABLE CENTER</text>
      <rect x="24" y="86" width="180" height="31" rx="7" fill="#111c34" stroke="#38bdf8" stroke-opacity=".25"/>
      <text x="114" y="107" text-anchor="middle" fill="#bae6fd" font-size="13">Business rules</text>
      <rect x="24" y="126" width="180" height="31" rx="7" fill="#17152f" stroke="#8b5cf6" stroke-opacity=".25"/>
      <text x="114" y="147" text-anchor="middle" fill="#ddd6fe" font-size="13">Explicit contracts</text>
      <rect x="24" y="166" width="180" height="31" rx="7" fill="#0d292b" stroke="#2dd4bf" stroke-opacity=".25"/>
      <text x="114" y="187" text-anchor="middle" fill="#99f6e4" font-size="13">Type-safe boundaries</text>
    </g>

    <g transform="translate(742 133)">
      <rect width="188" height="194" rx="16" fill="#0c1427" stroke="#2dd4bf" stroke-opacity=".3"/>
      <circle cx="24" cy="27" r="5" fill="#2dd4bf" filter="url(#glow)"/>
      <text x="40" y="33" fill="#99f6e4" font-size="14" font-weight="700" letter-spacing="1">03 / DELIVERY</text>
      <path d="M20 51H168" stroke="#94a3b8" stroke-opacity=".12"/>
      <text x="24" y="82" fill="#e2e8f0" font-size="14">Data systems</text>
      <text x="24" y="111" fill="#e2e8f0" font-size="14">AI workflows</text>
      <text x="24" y="140" fill="#e2e8f0" font-size="14">Integrations</text>
      <text x="24" y="169" fill="#e2e8f0" font-size="14">Async processing</text>
    </g>

    <g transform="translate(958 133)">
      <rect width="188" height="194" rx="16" fill="#0c1427" stroke="#38bdf8" stroke-opacity=".3"/>
      <circle cx="24" cy="27" r="5" fill="#38bdf8" filter="url(#glow)"/>
      <text x="40" y="33" fill="#7dd3fc" font-size="14" font-weight="700" letter-spacing="1">04 / OPERATE</text>
      <path d="M20 51H168" stroke="#94a3b8" stroke-opacity=".12"/>
      <text x="24" y="82" fill="#e2e8f0" font-size="14">Cloud runtime</text>
      <text x="24" y="111" fill="#e2e8f0" font-size="14">CI / CD</text>
      <text x="24" y="140" fill="#e2e8f0" font-size="14">Observability</text>
      <text x="24" y="169" fill="#e2e8f0" font-size="14">Feedback loops</text>
    </g>

    <g fill="none" stroke="#64748b" stroke-opacity=".5" stroke-width="2">
      <path d="M242 230H270"/><path d="M458 230H486"/><path d="M714 230H742"/><path d="M930 230H958"/>
    </g>
    <g fill="#94a3b8"><path d="m266 225 8 5-8 5z"/><path d="m482 225 8 5-8 5z"/><path d="m738 225 8 5-8 5z"/><path d="m954 225 8 5-8 5z"/></g>

    <g transform="translate(54 374)">
      <rect width="1092" height="48" rx="12" fill="#0b1d2b" stroke="#2dd4bf" stroke-opacity=".35"/>
      <text x="546" y="30" text-anchor="middle" fill="#99f6e4" font-size="13" font-weight="700" letter-spacing="1.8">SECURITY  •  PERFORMANCE  •  OBSERVABILITY  •  DOCUMENTATION  •  AUTOMATION</text>
    </g>
  </g>
</svg>
